services:
  # Backend Web Service
  - type: web
    name: final-page-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: final-page-db
          property: connectionString

  # Frontend Static Site (SPA)
  - type: web
    name: final-page-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    region: oregon
    branch: main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://final-page-backend.onrender.com

databases:
  - name: final-page-db
    databaseName: recruitment_db
    user: clyptus_user
    plan: free
    region: oregon
