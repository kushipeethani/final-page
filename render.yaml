services:
  # Backend Web Service (Docker)
  - type: web
    name: final-page-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: final-page-db
          property: connectionString

databases:
  - name: final-page-db
    databaseName: recruitment_db
    user: clyptus_user
    plan: free
    region: oregon
